[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  GENERATE_SOURCEMAP = "false"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # microphone=(self) — In-Store voice check-off uses getUserMedia
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    # style-src/font-src allow Google Fonts (DM Sans + Fraunces); img-src allows
    # blob:/data: for feedback screenshot resize previews
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data: blob:; connect-src 'self' https://n8n-grocery.needexcelexpert.com https://clip.needexcelexpert.com; font-src 'self' https://fonts.gstatic.com;"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
